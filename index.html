<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>3D Photo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  background:#000;
  overflow:hidden;
  width:100%;
  height:100%;
  height:100dvh;
  overscroll-behavior:none;
}


/* =========================================================
   3D SCENE
========================================================= */

#scene{
  position:fixed;
  inset:0;

  perspective:850px;
  perspective-origin:50% 45%;

  overflow:hidden;

  touch-action:none;
}

#world{
  position:absolute;

  top:50%;
  left:50%;

  width:0;
  height:0;

  transform-style:preserve-3d;

  will-change:transform;
}


/* =========================================================
   PHOTO
   RASIO 2:3
========================================================= */

.photo{
  position:absolute;

  /*
    RASIO FOTO = 2:3

    Maksimal:
    340px x 510px

    Pada layar kecil:
    lebar mengikuti viewport.
  */

  width:min(78vw,340px);
  height:calc(min(78vw,340px) * 1.5);

  margin-left:calc(min(78vw,340px) / -2);
  margin-top:calc(min(78vw,340px) * 1.5 / -2);

  border:2.5px solid rgba(0,200,255,.85);

  border-radius:10px;

  overflow:hidden;

  background:#001a2e;

  box-shadow:
    0 0 20px rgba(0,200,255,.48);

  backface-visibility:hidden;

  transform-style:preserve-3d;

  will-change:transform;
}

.photo img{
  display:block;

  width:100%;
  height:100%;

  /*
    Karena SEMUA foto sudah rasio 2:3,
    tidak perlu crop aneh.

    cover menjaga frame penuh.
  */
  object-fit:cover;

  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;

  /*
    Jangan membuat browser melakukan
    resize tambahan yang tidak perlu.
  */
  image-rendering:auto;

  decoding:async;
}


/* =========================================================
   CORRIDOR
========================================================= */

.corridor{
  position:absolute;

  top:50%;
  left:50%;

  transform-style:preserve-3d;

  pointer-events:none;
}

.floor-line,
.wall-line{
  position:absolute;
}

.floor-line{
  background:rgba(0,200,255,.20);

  height:1px;
  width:2000px;

  left:-1000px;
  top:215px;
}

.wall-line{
  background:rgba(0,200,255,.15);

  width:2px;
  height:460px;

  top:-20px;
}


/* =========================================================
   VIGNETTE
========================================================= */

#vignette{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 28%,
      rgba(0,0,0,.92)
    );

  pointer-events:none;

  z-index:40;
}


/* =========================================================
   STARFIELD
========================================================= */

#starfield{
  position:fixed;
  inset:0;

  z-index:0;

  background:
    radial-gradient(
      ellipse at bottom,
      #0a1520,
      #000
    );

  pointer-events:none;
}

#starfield>div{
  position:absolute;

  inset:-10%;

  width:120%;
  height:120%;

  animation:tw 2.5s ease-in-out infinite alternate;

  will-change:opacity,transform;
}

.s1{
  background:
    radial-gradient(1px 1px at 10px 20px,#fff,transparent),
    radial-gradient(1px 1px at 60px 15px,#fff,transparent),
    radial-gradient(1px 1px at 110px 35px,#fff,transparent),
    radial-gradient(1px 1px at 160px 45px,#fff,transparent),
    radial-gradient(1px 1px at 210px 65px,#fff,transparent),
    radial-gradient(1px 1px at 260px 30px,#fff,transparent),
    radial-gradient(1px 1px at 310px 40px,#fff,transparent),
    radial-gradient(1px 1px at 360px 55px,#fff,transparent),
    radial-gradient(1px 1px at 410px 20px,#fff,transparent),
    radial-gradient(1px 1px at 460px 50px,#fff,transparent),
    radial-gradient(1px 1px at 510px 15px,#fff,transparent);

  background-repeat:repeat;
  background-size:560px 220px;

  opacity:.85;
}

.s2{
  background:
    radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 160px 120px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 300px 100px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 440px 80px,#fff,transparent);

  background-repeat:repeat;
  background-size:600px 300px;

  opacity:.9;

  animation-duration:3.5s;
}

.s3{
  background:
    radial-gradient(2px 2px at 100px 200px,#fff,transparent),
    radial-gradient(2px 2px at 400px 100px,#fff,transparent),
    radial-gradient(2px 2px at 700px 150px,#fff,transparent),
    radial-gradient(2px 2px at 200px 500px,#fff,transparent);

  background-repeat:repeat;
  background-size:1100px 700px;

  animation-duration:5s;

  filter:drop-shadow(0 0 2px #fff);
}

.s4{
  background:
    radial-gradient(3px 3px at 150px 100px,#fff,transparent),
    radial-gradient(3px 3px at 750px 400px,#fff,transparent),
    radial-gradient(3px 3px at 300px 500px,#fff,transparent);

  background-repeat:repeat;
  background-size:1400px 800px;

  animation-duration:4s;

  filter:drop-shadow(0 0 5px #fff);
}

.s5{
  background:
    radial-gradient(3.5px 3.5px at 180px 280px,#a5f3fc,transparent),
    radial-gradient(3.5px 3.5px at 780px 480px,#a5f3fc,transparent),
    radial-gradient(3.5px 3.5px at 320px 600px,#bae6fd,transparent);

  background-repeat:repeat;
  background-size:1500px 900px;

  animation-duration:6s;

  filter:drop-shadow(0 0 8px #a5f3fc);
}

@keyframes tw{
  0%{
    opacity:.6;
  }

  100%{
    opacity:1;
  }
}


/* =========================================================
   MUSIC
========================================================= */

#musicBtn{
  position:fixed;

  bottom:calc(18px + env(safe-area-inset-bottom));
  left:18px;

  z-index:99;

  width:56px;
  height:56px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #10b981,
      #06b6d4
    );

  background-size:200% 200%;

  border:1.5px solid rgba(255,255,255,.5);

  color:#fff;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;

  box-shadow:
    0 6px 20px rgba(6,182,212,.55);

  animation:gs 4s linear infinite;

  touch-action:manipulation;
}

#musicBtn .w{
  display:flex;
  align-items:flex-end;

  gap:3px;

  height:18px;

  margin-left:3px;
}

#musicBtn .w b{
  width:2.5px;
  height:4px;

  border-radius:2px;

  background:#fff;

  opacity:.7;
}

#musicBtn.on .w b{
  opacity:1;

  animation:
    wb .9s ease-in-out infinite;
}

#musicBtn.on .w b:nth-child(2){
  animation-delay:.15s;
}

#musicBtn.on .w b:nth-child(3){
  animation-delay:.3s;
}

#musicBtn.on .w b:nth-child(4){
  animation-delay:.45s;
}

@keyframes gs{
  to{
    background-position:200% 50%;
  }
}

@keyframes wb{
  0%,100%{
    height:4px;
  }

  50%{
    height:16px;
  }
}


/* =========================================================
   REPLAY
========================================================= */

#replay{
  position:fixed;

  bottom:calc(18px + env(safe-area-inset-bottom));
  right:18px;

  padding:14px 26px;

  background:rgba(10,25,41,.8);

  border:1.5px solid rgba(255,255,255,.5);

  color:#fff;

  font:
    700 .9rem
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  letter-spacing:2px;

  text-transform:uppercase;

  cursor:pointer;

  z-index:100;

  border-radius:40px;

  opacity:0;

  transform:translateY(8px);

  pointer-events:none;

  transition:
    opacity .35s,
    transform .35s;

  touch-action:manipulation;

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

#replay.on{
  opacity:1;

  transform:translateY(0);

  pointer-events:auto;
}


/* =========================================================
   LOADING
========================================================= */

#loading{
  position:fixed;
  inset:0;

  background:#000;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  z-index:200;

  color:#0cf;

  transition:opacity .5s;
}

#loading.hide{
  opacity:0;

  pointer-events:none;
}

.ring{
  width:64px;
  height:64px;

  border:
    3px solid
    rgba(0,200,255,.15);

  border-top-color:#0cf;
  border-right-color:#0cf;

  border-radius:50%;

  animation:
    sp .9s linear infinite;

  margin-bottom:22px;
}

@keyframes sp{
  to{
    transform:rotate(360deg);
  }
}

#loading p{
  font:
    12px
    monospace;

  letter-spacing:4px;

  text-transform:uppercase;

  opacity:.85;
}

#pct{
  font:
    700 30px
    monospace;

  margin-bottom:14px;

  text-shadow:
    0 0 18px #0cf;
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width:380px){

  .photo{
    width:82vw;

    /*
      2:3
    */
    height:123vw;

    margin-left:-41vw;
    margin-top:-61.5vw;
  }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (max-height:500px) and (orientation:landscape){

  .photo{
    width:min(45vw,300px);

    /*
      2:3
    */
    height:calc(min(45vw,300px) * 1.5);

    margin-left:
      calc(min(45vw,300px) / -2);

    margin-top:
      calc(min(45vw,300px) * 1.5 / -2);
  }

  #scene{
    perspective:600px;
  }
}

</style>
</head>


<body>


<!-- =======================================================
     STARFIELD
======================================================= -->

<div id="starfield">

  <div class="s1"></div>
  <div class="s2"></div>
  <div class="s3"></div>
  <div class="s4"></div>
  <div class="s5"></div>

</div>


<!-- =======================================================
     3D WORLD
======================================================= -->

<div id="scene">

  <div id="world"></div>

</div>


<!-- =======================================================
     VIGNETTE
======================================================= -->

<div id="vignette"></div>


<!-- =======================================================
     MUSIC BUTTON
======================================================= -->

<button
  id="musicBtn"
  aria-label="Musik">

  🎵

  <span class="w">
    <b></b>
    <b></b>
    <b></b>
    <b></b>
  </span>

</button>


<audio
  id="bgMusic"
  loop
  preload="none">

  <source
    src="lomba-sihir.mp3"
    type="audio/mpeg">

</audio>


<!-- =======================================================
     REPLAY
======================================================= -->

<button
  id="replay"
  aria-label="Replay">

  ↻ Replay

</button>


<!-- =======================================================
     LOADING
======================================================= -->

<div id="loading">

  <div class="ring"></div>

  <div id="pct">
    0%
  </div>

  <p>
    Memuat Foto
  </p>

</div>


<script>
'use strict';


/* =========================================================
   CONFIG
========================================================= */

const N = 22;

/*
  Jarak antar foto.
*/
const SP = 700;

/*
  Lebar perubahan jalur.
*/
const SH = 260;

/*
  Foto per segmen.
*/
const SEG = 3;

/*
  Durasi animasi.
*/
const DUR = 45000;

/*
  Setengah lebar koridor.
*/
const HW = 320;

/*
  Sudut foto.
*/
const ANG = 35;

/*
  Total kedalaman.
*/
const TD = SP * N;


/* =========================================================
   ELEMENT
========================================================= */

const $ =
  id => document.getElementById(id);

const world =
  $('world');

const sceneEl =
  $('scene');

const replayBtn =
  $('replay');

const musicBtn =
  $('musicBtn');

const bgMusic =
  $('bgMusic');

const pct =
  $('pct');

const loading =
  $('loading');


/* =========================================================
   PATH
========================================================= */

const PAT =
  [0,1,0,-1];

const paths =
  [];


for(let i=0;i<N;i++){

  const s =
    Math.floor(i / SEG);

  const tg =
    PAT[s % 4] * SH;

  const p =
    (i % SEG) / SEG;

  /*
    Smooth interpolation.
  */
  const t =
    p * p * (3 - 2 * p);

  const pv =
    PAT[Math.max(0,s-1) % 4] * SH;

  const off =
    pv + (tg - pv) * t;

  const dl =
    i
      ? off - paths[i-1].o
      : 0;

  const yaw =
    Math.atan2(dl,SP) * 45.8;

  const sd =
    i % 2
      ? -1
      : 1;

  paths.push({
    o:off,
    yaw:yaw,
    px:off + sd * HW,
    rot:(sd < 0 ? ANG : -ANG) - yaw
  });
}


/* =========================================================
   CREATE ALL PHOTO ELEMENTS
========================================================= */

const frag =
  document.createDocumentFragment();

const photos =
  [];


for(let i=0;i<N;i++){

  const d =
    document.createElement('div');

  const im =
    document.createElement('img');


  d.className =
    'photo';


  im.alt =
    'Foto ' + (i + 1);


  im.decoding =
    'async';


  /*
    Semua foto langsung mempunyai src.

    Jadi setelah halaman siap,
    tidak ada foto yang muncul
    satu-satu karena JS.
  */

  im.src =
    `kuara-${i+1}.webp`;


  /*
    Browser tahu gambar akan dipakai.
  */

  im.loading =
    'eager';

  im.fetchPriority =
    'high';


  d.style.transform =
    `translate3d(
      ${paths[i].px}px,
      0,
      ${-i * SP}px
    )
    rotateY(${paths[i].rot}deg)`;


  d.appendChild(im);

  frag.appendChild(d);


  photos.push({
    el:d,
    img:im
  });
}


world.appendChild(frag);


/* =========================================================
   CORRIDOR
========================================================= */

const corr =
  document.createElement('div');

corr.className =
  'corridor';

world.appendChild(corr);


const cf =
  document.createDocumentFragment();


for(let i=0;i<N+10;i++){

  const p =
    paths[Math.min(i,N-1)];

  const z =
    -i * SP;

  const transform =
    `translate3d(
      ${p.o}px,
      0,
      ${z}px
    )
    rotateY(${p.yaw}deg)`;


  /*
    FLOOR
  */

  const f =
    document.createElement('div');

  f.className =
    'floor-line';

  f.style.transform =
    transform;

  cf.appendChild(f);


  /*
    LEFT WALL
  */

  const l =
    document.createElement('div');

  l.className =
    'wall-line';

  l.style.left =
    -HW + 'px';

  l.style.transform =
    transform;

  cf.appendChild(l);


  /*
    RIGHT WALL
  */

  const r =
    document.createElement('div');

  r.className =
    'wall-line';

  r.style.left =
    HW + 'px';

  r.style.transform =
    transform;

  cf.appendChild(r);
}


corr.appendChild(cf);


/* =========================================================
   SHUFFLE
========================================================= */

const nums =
  Array.from(
    {length:N},
    (_,i) => i + 1
  );


function shuffleArray(){

  for(
    let i=nums.length-1;
    i>0;
    i--
  ){

    const j =
      (Math.random() * (i+1)) | 0;

    [
      nums[i],
      nums[j]
    ] =
    [
      nums[j],
      nums[i]
    ];
  }
}


/* =========================================================
   SET PHOTO SOURCES
========================================================= */

function setPhotoSources(){

  photos.forEach(
    (p,k)=>{

      const src =
        `kuara-${nums[k]}.webp`;

      /*
        Hanya ubah jika berbeda.
      */

      if(
        p.img.dataset.src === src
      ){
        return;
      }

      p.img.dataset.src =
        src;

      p.img.src =
        src;

    }
  );
}


/* =========================================================
   PRELOAD SEMUA FOTO
========================================================= */

/*
  Karena file sudah WebP,
  tidak perlu:

    fetch()
    blob()
    ObjectURL

  Kita gunakan Image() langsung.

  Semua 22 dimuat paralel.
*/

let loaded =
  0;


function preloadOne(idx){

  return new Promise(resolve=>{

    const img =
      new Image();

    img.decoding =
      'async';

    img.onload =
      ()=>{
        loaded++;
        updateLoading();
        resolve();
      };

    img.onerror =
      ()=>{
        loaded++;
        updateLoading();
        resolve();
      };

    img.src =
      `kuara-${idx}.webp`;

  });
}


function updateLoading(){

  const value =
    Math.round(
      loaded / N * 100
    );

  pct.textContent =
    value + '%';
}


async function preloadAll(){

  /*
    Semua foto diminta sekaligus.

    Browser yang mengatur
    bandwidth dan cache.
  */

  const tasks =
    [];

  for(let i=1;i<=N;i++){

    tasks.push(
      preloadOne(i)
    );
  }

  await Promise.all(tasks);
}


/* =========================================================
   LOOK AROUND
========================================================= */

let lookX = 0;
let lookY = 0;

let targetLookX = 0;
let targetLookY = 0;

let isDragging = false;

let lastPointerX = 0;
let lastPointerY = 0;


const MAX_LOOK_YAW =
  10;

const MAX_LOOK_PITCH =
  6;


function onPointerDown(e){

  if(
    e.target.closest('button')
  ){
    return;
  }

  isDragging =
    true;

  lastPointerX =
    e.clientX;

  lastPointerY =
    e.clientY;

  sceneEl.setPointerCapture?.(
    e.pointerId
  );
}


function onPointerMove(e){

  if(!isDragging){
    return;
  }

  const dx =
    e.clientX -
    lastPointerX;

  const dy =
    e.clientY -
    lastPointerY;

  lastPointerX =
    e.clientX;

  lastPointerY =
    e.clientY;


  targetLookX -=
    dx * .035;

  targetLookY -=
    dy * .025;


  targetLookX =
    Math.max(
      -MAX_LOOK_YAW,
      Math.min(
        MAX_LOOK_YAW,
        targetLookX
      )
    );


  targetLookY =
    Math.max(
      -MAX_LOOK_PITCH,
      Math.min(
        MAX_LOOK_PITCH,
        targetLookY
      )
    );
}


function onPointerUp(e){

  isDragging =
    false;

  sceneEl.releasePointerCapture?.(
    e.pointerId
  );
}


sceneEl.addEventListener(
  'pointerdown',
  onPointerDown,
  {passive:true}
);

window.addEventListener(
  'pointermove',
  onPointerMove,
  {passive:true}
);

window.addEventListener(
  'pointerup',
  onPointerUp,
  {passive:true}
);

window.addEventListener(
  'pointercancel',
  onPointerUp,
  {passive:true}
);


/* =========================================================
   ANIMATION
========================================================= */

let animId =
  null;

let startTime =
  0;

let running =
  false;


function animate(ts){

  if(!running){
    return;
  }


  if(!startTime){
    startTime =
      ts;
  }


  const pr =
    Math.min(
      (ts - startTime) / DUR,
      1
    );


  const z =
    600 +
    pr * (TD + 1000);


  /*
    Look kembali ke tengah
    saat tidak disentuh.
  */

  if(!isDragging){

    targetLookX *= .90;
    targetLookY *= .90;
  }


  lookX +=
    (targetLookX - lookX) * .08;

  lookY +=
    (targetLookY - lookY) * .08;


  world.style.transform =
    `translate3d(
      0,
      0,
      ${z}px
    )
    rotateX(${lookY}deg)
    rotateY(${lookX}deg)`;


  if(pr < 1){

    animId =
      requestAnimationFrame(
        animate
      );

  }else{

    running =
      false;

    animId =
      null;

    replayBtn.classList.add(
      'on'
    );
  }
}


/* =========================================================
   START
========================================================= */

function start(){

  replayBtn.classList.remove(
    'on'
  );


  startTime =
    0;


  targetLookX =
    0;

  targetLookY =
    0;

  lookX =
    0;

  lookY =
    0;


  world.style.transform =
    'translate3d(0,0,0)';


  if(animId){

    cancelAnimationFrame(
      animId
    );

    animId =
      null;
  }


  running =
    true;


  animId =
    requestAnimationFrame(
      animate
    );
}


/* =========================================================
   STOP
========================================================= */

function stop(){

  running =
    false;

  if(animId){

    cancelAnimationFrame(
      animId
    );

    animId =
      null;
  }
}


/* =========================================================
   REPLAY
========================================================= */

replayBtn.onclick =
  ()=>{

    stop();


    replayBtn.classList.remove(
      'on'
    );


    shuffleArray();


    setPhotoSources();


    requestAnimationFrame(
      ()=>{
        requestAnimationFrame(
          start
        );
      }
    );
  };


/* =========================================================
   MUSIC
========================================================= */

let musicOn =
  false;


musicBtn.onclick =
  ()=>{

    if(musicOn){

      bgMusic.pause();

      musicBtn.classList.remove(
        'on'
      );

      musicOn =
        false;

      return;
    }


    bgMusic.play()
      .then(
        ()=>{

          musicBtn.classList.add(
            'on'
          );

          musicOn =
            true;

        }
      )
      .catch(
        ()=>{}
      );
  };


/* =========================================================
   PARALLAX BINTANG
========================================================= */

const L = [

  ['.s1',6],
  ['.s2',10],
  ['.s3',16],
  ['.s4',24],
  ['.s5',32]

].map(
  ([sel,v]) =>
    [
      document.querySelector(sel),
      v
    ]
);


let tb = 0;
let tg = 0;

let cb = 0;
let cg = 0;


const mob =
  /Mobi|Android|iPhone|iPad/i
  .test(
    navigator.userAgent
  );


function orient(e){

  tb =
    e.beta || 0;

  tg =
    e.gamma || 0;
}


function mouse(e){

  tg =
    (
      e.clientX /
      innerWidth *
      2 - 1
    ) * 30;

  tb =
    (
      e.clientY /
      innerHeight *
      2 - 1
    ) * 30;
}


if(
  mob &&
  typeof DeviceOrientationEvent !==
  'undefined'
){

  /*
    Untuk Android dan browser
    yang tidak memerlukan permission.
  */

  if(
    typeof DeviceOrientationEvent.requestPermission !==
    'function'
  ){

    addEventListener(
      'deviceorientation',
      orient,
      {passive:true}
    );
  }

}else{

  addEventListener(
    'mousemove',
    mouse,
    {passive:true}
  );
}


/* =========================================================
   STAR PARALLAX LOOP
========================================================= */

(function px(){

  cb +=
    (tb - cb) * .08;

  cg +=
    (tg - cg) * .08;


  const b =
    Math.max(
      -35,
      Math.min(
        35,
        cb
      )
    );

  const g =
    Math.max(
      -35,
      Math.min(
        35,
        cg
      )
    );


  L.forEach(
    ([el,v])=>{

      if(!el){
        return;
      }

      el.style.transform =
        `translate3d(
          ${-g/90*v}px,
          ${-b/90*v}px,
          0
        )`;
    }
  );


  requestAnimationFrame(
    px
  );

})();


/* =========================================================
   INIT
========================================================= */

(async function init(){

  /*
    Buat urutan random.
  */

  shuffleArray();


  /*
    Pasang semua foto SEKALIGUS.
  */

  setPhotoSources();


  /*
    Tunggu semua 22 WebP selesai.
    Setelah ini tidak ada foto yang
    muncul belakangan.
  */

  await preloadAll();


  /*
    Semua foto sudah tersedia.
  */

  pct.textContent =
    '100%';


  /*
    Hilangkan loading.
  */

  loading.classList.add(
    'hide'
  );


  setTimeout(
    ()=>{
      loading.remove();
    },
    550
  );


  /*
    Mulai animasi.
  */

  setTimeout(
    start,
    100
  );

})();
</script>
