<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>3D Photo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;overflow:hidden;width:100%;height:100%;height:100dvh;overscroll-behavior:none}

#scene{position:fixed;inset:0;perspective:850px;perspective-origin:50% 45%;overflow:hidden;touch-action:none}
#world{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}

.photo{
  position:absolute;
  width:min(78vw,340px);
  height:calc(min(78vw,340px) * 1.5);
  margin-left:calc(min(78vw,340px) / -2);
  margin-top:calc(min(78vw,340px) * 1.5 / -2);
  border:2.5px solid rgba(0,200,255,.85);
  border-radius:10px;
  overflow:hidden;
  background:#001a2e;
  box-shadow:0 0 20px rgba(0,200,255,.48);
  backface-visibility:hidden;
  transform-style:preserve-3d;
  contain:layout style paint;
}
.photo img{
  display:block;width:100%;height:100%;
  object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none;
  image-rendering:auto;
}

.corridor{position:absolute;top:50%;left:50%;transform-style:preserve-3d;pointer-events:none}
.floor-line,.wall-line{position:absolute}
.floor-line{background:rgba(0,200,255,.20);height:1px;width:2000px;left:-1000px;top:215px}
.wall-line{background:rgba(0,200,255,.15);width:2px;height:460px;top:-20px}

#vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.92));pointer-events:none;z-index:40}

#starfield{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at bottom,#0a1520,#000);pointer-events:none;overflow:hidden}
#starfield>div{position:absolute;inset:-10%;width:120%;height:120%;animation:tw 3s ease-in-out infinite alternate;will-change:transform}
.s1{background:radial-gradient(1px 1px at 10px 20px,#fff,transparent),radial-gradient(1px 1px at 60px 15px,#fff,transparent),radial-gradient(1px 1px at 110px 35px,#fff,transparent),radial-gradient(1px 1px at 160px 45px,#fff,transparent),radial-gradient(1px 1px at 210px 65px,#fff,transparent),radial-gradient(1px 1px at 260px 30px,#fff,transparent);background-repeat:repeat;background-size:560px 220px;opacity:.85}
.s2{background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 120px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 100px,#fff,transparent);background-repeat:repeat;background-size:600px 300px;opacity:.9;animation-duration:4s}
.s3{background:radial-gradient(2.5px 2.5px at 100px 200px,#a5f3fc,transparent),radial-gradient(2.5px 2.5px at 400px 100px,#bae6fd,transparent),radial-gradient(2.5px 2.5px at 700px 150px,#fff,transparent);background-repeat:repeat;background-size:1100px 700px;animation-duration:5s;filter:drop-shadow(0 0 4px #a5f3fc)}
@keyframes tw{0%{opacity:.6}100%{opacity:1}}

#musicBtn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;z-index:99;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#10b981,#06b6d4);background-size:200% 200%;border:1.5px solid rgba(255,255,255,.5);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 20px rgba(6,182,212,.55);animation:gs 4s linear infinite;touch-action:manipulation}
#musicBtn .w{display:flex;align-items:flex-end;gap:3px;height:18px;margin-left:3px}
#musicBtn .w b{width:2.5px;height:4px;border-radius:2px;background:#fff;opacity:.7}
#musicBtn.on .w b{opacity:1;animation:wb .9s ease-in-out infinite}
#musicBtn.on .w b:nth-child(2){animation-delay:.15s}
#musicBtn.on .w b:nth-child(3){animation-delay:.3s}
#musicBtn.on .w b:nth-child(4){animation-delay:.45s}
@keyframes gs{to{background-position:200% 50%}}
@keyframes wb{0%,100%{height:4px}50%{height:16px}}

#replay{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;padding:14px 26px;background:rgba(10,25,41,.85);border:1.5px solid rgba(255,255,255,.5);color:#fff;font:700 .9rem -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;z-index:100;border-radius:40px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .35s,transform .35s;touch-action:manipulation}
#replay.on{opacity:1;transform:translateY(0);pointer-events:auto}

#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;color:#0cf;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
.ring{width:64px;height:64px;border:3px solid rgba(0,200,255,.15);border-top-color:#0cf;border-right-color:#0cf;border-radius:50%;animation:sp .9s linear infinite;margin-bottom:22px}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{font:12px monospace;letter-spacing:4px;text-transform:uppercase;opacity:.85}
#pct{font:700 30px monospace;margin-bottom:14px;text-shadow:0 0 18px #0cf}

@media (max-width:380px){
  .photo{width:82vw;height:123vw;margin-left:-41vw;margin-top:-61.5vw}
}
@media (max-height:500px) and (orientation:landscape){
  .photo{width:min(45vw,300px);height:calc(min(45vw,300px) * 1.5);margin-left:calc(min(45vw,300px) / -2);margin-top:calc(min(45vw,300px) * 1.5 / -2)}
  #scene{perspective:600px}
}
</style>
</head>
<body>

<div id="starfield">
  <div class="s1"></div>
  <div class="s2"></div>
  <div class="s3"></div>
</div>

<div id="scene"><div id="world"></div></div>
<div id="vignette"></div>

<button id="musicBtn" aria-label="Musik">🎵<span class="w"><b></b><b></b><b></b><b></b></span></button>
<audio id="bgMusic" loop preload="metadata"><source src="lomba-sihir.mp3" type="audio/mpeg"></audio>
<button id="replay" aria-label="Replay">↻ Replay</button>

<div id="loading">
  <div class="ring"></div>
  <div id="pct">0%</div>
  <p>Memuat Foto</p>
</div>

<script>
'use strict';

/* =========================================================
   CONFIG
========================================================= */
const N   = 22;      // jumlah foto
const SP  = 700;     // jarak antar foto
const SH  = 260;     // lebar perubahan jalur
const SEG = 3;       // foto per segmen
const DUR = 45000;   // durasi animasi (ms)
const HW  = 320;     // setengah lebar koridor
const ANG = 35;      // sudut foto
const TD  = SP * N;  // total kedalaman

/* =========================================================
   ELEMENT
========================================================= */
const $ = id => document.getElementById(id);
const world     = $('world');
const sceneEl   = $('scene');
const replayBtn = $('replay');
const musicBtn  = $('musicBtn');
const bgMusic   = $('bgMusic');
const pct       = $('pct');
const loading   = $('loading');

/* =========================================================
   PATH
========================================================= */
const PAT   = [0,1,0,-1];
const paths = [];

for (let i = 0; i < N; i++) {
  const s  = Math.floor(i / SEG);
  const tg = PAT[s % 4] * SH;
  const p  = (i % SEG) / SEG;
  const t  = p * p * (3 - 2 * p);
  const pv = PAT[Math.max(0, s - 1) % 4] * SH;
  const off = pv + (tg - pv) * t;
  const dl  = i ? off - paths[i - 1].o : 0;
  const yaw = Math.atan2(dl, SP) * 45.8;
  const sd  = i % 2 ? -1 : 1;
  paths.push({
    o: off,
    yaw,
    px: off + sd * HW,
    rot: (sd < 0 ? ANG : -ANG) - yaw
  });
}

/* =========================================================
   BUILD PHOTOS
========================================================= */
const frag   = document.createDocumentFragment();
const photos = [];

for (let i = 0; i < N; i++) {
  const d  = document.createElement('div');
  const im = document.createElement('img');
  d.className = 'photo';
  im.alt      = 'Foto ' + (i + 1);
  im.decoding = 'async';
  im.loading  = 'eager';
  im.fetchPriority = 'high';
  im.src = `kuara-${i + 1}.webp`;

  d.style.transform = `translate3d(${paths[i].px}px,0,${-i * SP}px) rotateY(${paths[i].rot}deg)`;
  d.appendChild(im);
  frag.appendChild(d);
  photos.push({ el: d, img: im });
}
world.appendChild(frag);

/* =========================================================
   CORRIDOR (ringan: cukup N, bukan N+10)
========================================================= */
const corr = document.createElement('div');
corr.className = 'corridor';
world.appendChild(corr);
const cf = document.createDocumentFragment();

for (let i = 0; i < N; i++) {
  const p  = paths[i];
  const z  = -i * SP;
  const tr = `translate3d(${p.o}px,0,${z}px) rotateY(${p.yaw}deg)`;

  const f = document.createElement('div');
  f.className = 'floor-line';
  f.style.transform = tr;
  cf.appendChild(f);

  const l = document.createElement('div');
  l.className = 'wall-line';
  l.style.left = -HW + 'px';
  l.style.transform = tr;
  cf.appendChild(l);

  const r = document.createElement('div');
  r.className = 'wall-line';
  r.style.left = HW + 'px';
  r.style.transform = tr;
  cf.appendChild(r);
}
corr.appendChild(cf);

/* =========================================================
   SHUFFLE
========================================================= */
const nums = Array.from({ length: N }, (_, i) => i + 1);

function shuffleArray() {
  for (let i = nums.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [nums[i], nums[j]] = [nums[j], nums[i]];
  }
}

function setPhotoSources() {
  photos.forEach((p, k) => {
    const src = `kuara-${nums[k]}.webp`;
    if (p.img.dataset.src === src) return;
    p.img.dataset.src = src;
    p.img.src = src;
  });
}

/* =========================================================
   PRELOAD (concurrency 4, pakai decode)
========================================================= */
let loaded = 0;
function updateLoading() {
  pct.textContent = Math.round(loaded / N * 100) + '%';
}

function preloadOne(idx) {
  return new Promise(resolve => {
    const img = new Image();
    img.decoding = 'async';
    const done = () => {
      loaded++;
      updateLoading();
      resolve();
    };
    img.onload  = () => { img.decode?.().catch(()=>{}).finally(done); };
    img.onerror = done;
    img.src = `kuara-${idx}.webp`;
  });
}

async function preloadAll() {
  const queue = [];
  for (let i = 1; i <= N; i++) queue.push(i);

  const workers = [];
  const CONCURRENCY = 4;
  for (let w = 0; w < CONCURRENCY; w++) {
    workers.push((async () => {
      while (queue.length) {
        const idx = queue.shift();
        await preloadOne(idx);
      }
    })());
  }
  await Promise.all(workers);
}

/* =========================================================
   DRAG / GESER (mobile + desktop)
========================================================= */
let lookX = 0, lookY = 0;
let targetLookX = 0, targetLookY = 0;
let isDragging = false;
let lastPointerX = 0, lastPointerY = 0;
const MAX_LOOK_YAW = 10;
const MAX_LOOK_PITCH = 6;

function onPointerDown(e) {
  if (e.target.closest('button')) return;
  isDragging = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  try { sceneEl.setPointerCapture(e.pointerId); } catch(_) {}
}

function onPointerMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  targetLookX = Math.max(-MAX_LOOK_YAW,  Math.min(MAX_LOOK_YAW,  targetLookX - dx * .035));
  targetLookY = Math.max(-MAX_LOOK_PITCH, Math.min(MAX_LOOK_PITCH, targetLookY - dy * .025));
}

function onPointerUp(e) {
  isDragging = false;
  try { sceneEl.releasePointerCapture(e.pointerId); } catch(_) {}
}

sceneEl.addEventListener('pointerdown',  onPointerDown,  { passive: true });
sceneEl.addEventListener('pointermove',  onPointerMove,  { passive: true });
sceneEl.addEventListener('pointerup',    onPointerUp,    { passive: true });
sceneEl.addEventListener('pointercancel', onPointerUp,   { passive: true });

/* =========================================================
   ANIMATION
========================================================= */
let animId = null;
let startTime = 0;
let running = false;

function animate(ts) {
  if (!running) return;
  if (!startTime) startTime = ts;

  const pr = Math.min((ts - startTime) / DUR, 1);
  const z  = 600 + pr * (TD + 1000);

  if (!isDragging) {
    targetLookX *= .90;
    targetLookY *= .90;
  }
  lookX += (targetLookX - lookX) * .08;
  lookY += (targetLookY - lookY) * .08;

  world.style.transform =
    `translate3d(0,0,${z}px) rotateX(${lookY}deg) rotateY(${lookX}deg)`;

  if (pr < 1) {
    animId = requestAnimationFrame(animate);
  } else {
    running = false;
    animId = null;
    replayBtn.classList.add('on');
  }
}

function start() {
  replayBtn.classList.remove('on');
  startTime = 0;
  targetLookX = targetLookY = 0;
  lookX = lookY = 0;
  world.style.transform = 'translate3d(0,0,0)';
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  running = true;
  animId = requestAnimationFrame(animate);
}

function stop() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

/* =========================================================
   REPLAY
========================================================= */
replayBtn.onclick = () => {
  stop();
  replayBtn.classList.remove('on');
  shuffleArray();
  setPhotoSources();
  requestAnimationFrame(() => requestAnimationFrame(start));
};

/* =========================================================
   MUSIC
========================================================= */
let musicOn = false;
musicBtn.onclick = () => {
  if (musicOn) {
    bgMusic.pause();
    musicBtn.classList.remove('on');
    musicOn = false;
    return;
  }
  bgMusic.play().then(() => {
    musicBtn.classList.add('on');
    musicOn = true;
  }).catch(() => {});
};

/* =========================================================
   PARALLAX BINTANG (gyro + mouse)
========================================================= */
const L = [
  ['.s1', 6],
  ['.s2', 14],
  ['.s3', 26]
].map(([sel, v]) => [document.querySelector(sel), v]);

let tb = 0, tg = 0;
let cb = 0, cg = 0;
let hasMotion = false;

function orient(e) {
  if (e.beta == null && e.gamma == null) return;
  hasMotion = true;
  tb = e.beta  || 0;
  tg = e.gamma || 0;
}

function mouse(e) {
  hasMotion = true;
  tg = (e.clientX / innerWidth  * 2 - 1) * 30;
  tb = (e.clientY / innerHeight * 2 - 1) * 30;
}

/* --- pasang listener gyro (iOS perlu izin) --- */
function enableGyro() {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(res => { if (res === 'granted') window.addEventListener('deviceorientation', orient, { passive: true }); })
      .catch(() => {});
  } else {
    window.addEventListener('deviceorientation', orient, { passive: true });
  }
}

/* desktop: pakai mouse */
if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
  window.addEventListener('mousemove', mouse, { passive: true });
} else {
  /* mobile: coba gyro langsung; kalau perlu izin, nanti dipicu tombol musik */
  enableGyro();
  /* fallback: kalau gyro tidak tersedia, gunakan pointer drag untuk parallax */
  window.addEventListener('pointermove', (e) => {
    if (hasMotion) return;
    tg = (e.clientX / innerWidth  * 2 - 1) * 30;
    tb = (e.clientY / innerHeight * 2 - 1) * 30;
  }, { passive: true });
}

/* =========================================================
   STAR PARALLAX LOOP (idle-skip)
========================================================= */
let lastCb = 0, lastCg = 0;
(function px() {
  cb += (tb - cb) * .08;
  cg += (tg - cg) * .08;

  const b = Math.max(-35, Math.min(35, cb));
  const g = Math.max(-35, Math.min(35, cg));

  /* skip render kalau tidak berubah signifikan */
  if (Math.abs(b - lastCb) > 0.05 || Math.abs(g - lastCg) > 0.05) {
    lastCb = b; lastCg = g;
    L.forEach(([el, v]) => {
      if (!el) return;
      el.style.transform = `translate3d(${-g / 90 * v}px,${-b / 90 * v}px,0)`;
    });
  }
  requestAnimationFrame(px);
})();

/* =========================================================
   INIT
========================================================= */
(async function init() {
  shuffleArray();
  setPhotoSources();

  await preloadAll();

  pct.textContent = '100%';
  loading.classList.add('hide');
  setTimeout(() => loading.remove(), 550);

  setTimeout(start, 100);
})();

/* =========================================================
   (opsional) aktifkan gyro saat user tap pertama kali
   di iOS — sekaligus memulai musik
========================================================= */
musicBtn.addEventListener('pointerdown', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    enableGyro();
  }
}, { once: true });
</script>
</body>
</html>
